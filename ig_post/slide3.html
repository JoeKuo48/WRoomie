<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>WRoomie - Slide 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }

  body {
    width: 1080px;
    height: 1350px;
    background-color: #FAF7F2;
    background-image: radial-gradient(rgba(188, 90, 54, 0.04) 1px, transparent 1px), radial-gradient(rgba(45, 39, 33, 0.03) 1px, #FAF7F2 1px);
    background-size: 36px 36px;
    background-position: 0 0, 18px 18px;
    font-family: 'Noto Serif TC', serif;
    color: #2D2721;
    overflow: hidden;
    position: relative;
    padding: 68px 80px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .frame-border {
    position: absolute;
    top: 32px;
    left: 32px;
    right: 32px;
    bottom: 32px;
    border: 1px solid rgba(188, 90, 54, 0.22);
    pointer-events: none;
    z-index: 100;
  }
  .frame-border::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 6px;
    right: 6px;
    bottom: 6px;
    border: 1px solid rgba(45, 39, 33, 0.08);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(188, 90, 54, 0.18);
    padding-bottom: 20px;
    position: relative;
    z-index: 10;
  }

  .brand-logo {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .brand-logo .eng {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #BC5A36;
  }

  .brand-logo .slash {
    color: #D4C8B8;
    font-weight: 300;
    font-size: 20px;
  }

  .brand-logo .cht {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #554D44;
  }

  .slide-tag {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #8C8275;
    text-transform: uppercase;
    background: #F0EAE1;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #E2D7C7;
  }

  .content-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    z-index: 10;
    padding: 24px 0 10px;
  }

  .watermark-year {
    position: absolute;
    right: -20px;
    top: 0px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 220px;
    font-weight: 700;
    color: rgba(188, 90, 54, 0.05);
    line-height: 0.8;
    user-select: none;
    pointer-events: none;
    z-index: -1;
  }

  .year-badge-container {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .year-pill {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #FFFFFF;
    background: #BC5A36;
    padding: 6px 18px;
    border-radius: 14px;
    text-transform: uppercase;
    box-shadow: 0 4px 12px rgba(188, 90, 54, 0.25);
  }

  .year-en-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: #8C8275;
    letter-spacing: 1px;
  }

  .slide-title {
    font-size: 40px;
    font-weight: 900;
    line-height: 1.35;
    color: #241E18;
    letter-spacing: 1.5px;
    margin-bottom: 18px;
  }

  .slide-title span {
    color: #BC5A36;
  }

  .story-p {
    font-size: 22px;
    line-height: 1.85;
    color: #453E36;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
    font-weight: 500;
  }

  .story-p strong {
    color: #BC5A36;
    font-weight: 700;
  }

  .roomie-highlight {
    background: #FFFFFF;
    border: 1px solid #E8E0D2;
    border-left: 4px solid #BC5A36;
    border-radius: 12px;
    padding: 16px 22px;
    font-size: 19px;
    line-height: 1.7;
    color: #554D44;
    margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(45, 39, 33, 0.03);
  }

  .roomie-highlight strong {
    color: #BC5A36;
  }

  .photo-duo-container {
    display: flex;
    gap: 28px;
    align-items: stretch;
    justify-content: space-between;
  }

  .polaroid-card {
    background: #FFFFFF;
    padding: 14px 14px 18px 14px;
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(45, 39, 33, 0.09);
    border: 1px solid #E8E1D5;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .polaroid-card.card-1 {
    transform: rotate(-1.5deg);
  }

  .polaroid-card.card-2 {
    transform: rotate(1.5deg);
  }

  .photo-frame {
    width: 100%;
    height: 340px;
    border-radius: 10px;
    overflow: hidden;
    background: #EEE7DC;
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-caption {
    font-size: 15px;
    color: #7D7366;
    text-align: center;
    margin-top: 14px;
    letter-spacing: 1px;
    font-family: 'Noto Serif TC', serif;
    font-weight: 500;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(188, 90, 54, 0.18);
    padding-top: 20px;
    position: relative;
    z-index: 10;
  }

  .footer-left {
    font-size: 14px;
    color: #8C8275;
    letter-spacing: 1.5px;
    font-family: 'Noto Serif TC', serif;
  }

  .swipe-hint {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #BC5A36;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="frame-border"></div>

  <div class="header">
    <div class="brand-logo">
      <span class="eng">WRoomie</span>
      <span class="slash">|</span>
      <span class="cht">料理</span>
    </div>
    <div class="slide-tag">Chapter 02 · 03/05</div>
  </div>

  <div class="content-main">
    <div class="watermark-year">2022</div>

    <div class="top-section">
      <div class="year-badge-container">
        <div class="year-pill">2022</div>
        <div class="year-en-sub">Birth of Roomie · 一日室友的餐桌</div>
      </div>

      <h2 class="slide-title">成立 Roomie：<span>把想像做成一桌好菜</span></h2>

      <p class="story-p">
        2022 年，我成立了 <strong>Roomie</strong>。<br>
        起心動念其實很單純，我想做一桌從食譜裡翻閱到、從旅行或生活中想像過的料理，約三五好友們來當我的一日室友享受美食。
      </p>

      <div class="roomie-highlight">
        特此感謝我的<strong>瘋狂室友</strong>，不畏油煙（他房間的空氣清淨機常常亮紅燈！）並且成為我的忠實嘉賓。
      </div>
    </div>

    <div class="photo-duo-container">
      <div class="polaroid-card card-1">
        <div class="photo-frame">
          <img src="images/food_1.jpg" alt="Roomie 料理創作">
        </div>
        <div class="photo-caption">翻閱食譜與旅行記憶的味覺想像</div>
      </div>

      <div class="polaroid-card card-2">
        <div class="photo-frame">
          <img src="images/food_2.jpg" alt="Roomie 私廚餐桌">
        </div>
        <div class="photo-caption">為一日室友端上的繽紛盛宴</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">2022 · 每一道菜，都是一次餐桌上的旅行</div>
    <div class="swipe-hint">SWIPE ➔</div>
  </div>
</body>
</html>
