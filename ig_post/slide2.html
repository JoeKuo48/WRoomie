<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>WRoomie - Slide 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }

  body {
    width: 1080px;
    height: 1350px;
    background-color: #FAF7F2;
    background-image: radial-gradient(rgba(188, 90, 54, 0.04) 1px, transparent 1px), radial-gradient(rgba(45, 39, 33, 0.03) 1px, #FAF7F2 1px);
    background-size: 36px 36px;
    background-position: 0 0, 18px 18px;
    font-family: 'Noto Serif TC', 'PingFang TC', 'Microsoft JhengHei', serif;
    color: #2D2721;
    overflow: hidden;
    position: relative;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .frame-border {
    position: absolute;
    top: 32px;
    left: 32px;
    right: 32px;
    bottom: 32px;
    border: 1px solid rgba(188, 90, 54, 0.22);
    pointer-events: none;
    z-index: 100;
  }
  .frame-border::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 6px;
    right: 6px;
    bottom: 6px;
    border: 1px solid rgba(45, 39, 33, 0.08);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(188, 90, 54, 0.18);
    padding-bottom: 22px;
    position: relative;
    z-index: 10;
  }

  .brand-logo {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .brand-logo .eng {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #BC5A36;
  }

  .brand-logo .slash {
    color: #D4C8B8;
    font-weight: 300;
    font-size: 20px;
  }

  .brand-logo .cht {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #554D44;
  }

  .slide-tag {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #8C8275;
    text-transform: uppercase;
    background: #F0EAE1;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #E2D7C7;
  }

  .content-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    z-index: 10;
    padding: 20px 0;
  }

  .watermark-year {
    position: absolute;
    right: -20px;
    top: 10px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 230px;
    font-weight: 700;
    color: rgba(188, 90, 54, 0.05);
    line-height: 0.8;
    user-select: none;
    pointer-events: none;
    z-index: -1;
  }

  .year-badge-container {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .year-pill {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #FFFFFF;
    background: #BC5A36;
    padding: 7px 18px;
    border-radius: 14px;
    text-transform: uppercase;
    box-shadow: 0 4px 12px rgba(188, 90, 54, 0.25);
  }

  .year-en-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: #8C8275;
    letter-spacing: 1px;
  }

  .slide-title {
    font-size: 44px;
    font-weight: 900;
    line-height: 1.35;
    color: #241E18;
    letter-spacing: 1.5px;
    margin-bottom: 32px;
  }

  .slide-title span {
    color: #BC5A36;
  }

  .story-p {
    font-size: 25px;
    line-height: 2.1;
    color: #453E36;
    letter-spacing: 0.8px;
    margin-bottom: 28px;
    font-weight: 500;
  }

  .story-p strong {
    color: #BC5A36;
    font-weight: 700;
  }

  .kitchen-card {
    background: #FFFFFF;
    border: 1px solid #E8E0D2;
    border-radius: 18px;
    padding: 42px 46px;
    margin-top: 20px;
    box-shadow: 0 8px 24px rgba(45, 39, 33, 0.04);
    position: relative;
  }

  .kitchen-quote-icon {
    font-family: 'Cormorant Garamond', serif;
    font-size: 80px;
    line-height: 1;
    color: #BC5A36;
    opacity: 0.25;
    position: absolute;
    top: 20px;
    right: 32px;
  }

  .keywords-tag-row {
    display: flex;
    gap: 12px;
    margin-top: 36px;
    flex-wrap: wrap;
  }

  .kw-tag {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: #6E6356;
    background: #F2ECE2;
    border: 1px solid #E0D6C6;
    padding: 8px 18px;
    border-radius: 20px;
    letter-spacing: 1px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(188, 90, 54, 0.18);
    padding-top: 22px;
    position: relative;
    z-index: 10;
  }

  .footer-left {
    font-size: 14px;
    color: #8C8275;
    letter-spacing: 1.5px;
    font-family: 'Noto Serif TC', serif;
  }

  .swipe-hint {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #BC5A36;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="frame-border"></div>

  <div class="header">
    <div class="brand-logo">
      <span class="eng">WRoomie</span>
      <span class="slash">|</span>
      <span class="cht">料理</span>
    </div>
    <div class="slide-tag">Chapter 01 · 02/05</div>
  </div>

  <div class="content-main">
    <div class="watermark-year">2012</div>

    <div class="year-badge-container">
      <div class="year-pill">2012</div>
      <div class="year-en-sub">The Spark · 闖入後場的起點</div>
    </div>

    <h2 class="slide-title">闖進後場的<span>文組大學生</span></h2>

    <p class="story-p">
      2012 年，我還只是一個普通的文組大學生，<br>
      不小心闖進了廚房後場——
    </p>

    <div class="kitchen-card">
      <div class="kitchen-quote-icon">“</div>
      <p class="story-p" style="margin-bottom: 0; font-size: 27px; line-height: 2;">
        那個 <strong>Rush</strong>、瘋狂，<br>
        卻又充滿<strong>生命力</strong>的領地。<br><br>
        從那之後，<strong>做菜成了我的志業。</strong>
      </p>
    </div>

    <div class="keywords-tag-row">
      <span class="kw-tag">#文組生的逆轉</span>
      <span class="kw-tag">#廚房後場Rush</span>
      <span class="kw-tag">#以料理為志業</span>
      <span class="kw-tag">#熱情起點</span>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">2012 · 從後場的高壓與生命力中萌生熱愛</div>
    <div class="swipe-hint">SWIPE ➔</div>
  </div>
</body>
</html>
